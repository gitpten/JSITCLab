<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Облік дітей, батьків, змін табору та бронювань.">
    <title>Система керування бронюванням у таборі</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <h1>Система керування бронюванням у таборі</h1>
      <nav class="tabs" role="tablist" aria-label="Записи табору">
        <button class="tab is-active" id="children-tab" type="button" role="tab" aria-selected="true" aria-controls="children-panel" tabindex="0" data-panel="children-panel">Діти</button>
        <button class="tab" id="parents-tab" type="button" role="tab" aria-selected="false" aria-controls="parents-panel" tabindex="-1" data-panel="parents-panel">Батьки</button>
        <button class="tab" id="camp-shifts-tab" type="button" role="tab" aria-selected="false" aria-controls="camp-shifts-panel" tabindex="-1" data-panel="camp-shifts-panel">Табірні зміни</button>
        <button class="tab" id="bookings-tab" type="button" role="tab" aria-selected="false" aria-controls="bookings-panel" tabindex="-1" data-panel="bookings-panel">Бронювання</button>
      </nav>

      <section class="entity-panel" id="children-panel" role="tabpanel" aria-labelledby="children-tab">
        <form class="record-form" id="child-form" novalidate>
          <h2>Додати дитину</h2>
          <div class="form-grid">
            <label><span class="field-label">Ім’я <span aria-hidden="true">*</span></span>
              <input name="firstName" type="text" autocomplete="given-name" required aria-describedby="firstName-error">
              <span class="field-error" id="firstName-error"></span>
            </label>
            <label><span class="field-label">Прізвище <span aria-hidden="true">*</span></span>
              <input name="lastName" type="text" autocomplete="family-name" required aria-describedby="lastName-error">
              <span class="field-error" id="lastName-error"></span>
            </label>
            <label>По батькові
              <input name="middleName" type="text" autocomplete="additional-name" aria-describedby="middleName-error">
              <span class="field-error" id="middleName-error"></span>
            </label>
            <label><span class="field-label">Дата народження <span aria-hidden="true">*</span></span>
              <input name="birthDate" type="date" required aria-describedby="birthDate-error">
              <span class="field-error" id="birthDate-error"></span>
            </label>
            <label><span class="field-label">Стать <span aria-hidden="true">*</span></span>
              <select name="gender" required aria-describedby="gender-error">
                <option value="">Оберіть стать</option>
                <option value="female">Жіноча</option>
                <option value="male">Чоловіча</option>
              </select>
              <span class="field-error" id="gender-error"></span>
            </label>
            <label class="form-field-wide">Примітки
              <textarea name="notes" rows="3" aria-describedby="notes-error"></textarea>
              <span class="field-error" id="notes-error"></span>
            </label>
          </div>
          <p class="form-message" id="child-form-message" role="status" aria-live="polite"></p>
          <button class="submit-button" type="submit">Додати дитину</button>
        </form>
        <div class="table-wrap" id="children-table"></div>
      </section>
      <section class="entity-panel" id="parents-panel" role="tabpanel" aria-labelledby="parents-tab" hidden>
        <form class="record-form" id="parent-form" novalidate>
          <h2>Додати батька або законного представника</h2>
          <div class="form-grid">
            <label><span class="field-label">Ім’я <span aria-hidden="true">*</span></span>
              <input name="firstName" type="text" autocomplete="given-name" required aria-describedby="parent-firstName-error">
              <span class="field-error" id="parent-firstName-error"></span>
            </label>
            <label><span class="field-label">Прізвище <span aria-hidden="true">*</span></span>
              <input name="lastName" type="text" autocomplete="family-name" required aria-describedby="parent-lastName-error">
              <span class="field-error" id="parent-lastName-error"></span>
            </label>
            <label>По батькові
              <input name="middleName" type="text" autocomplete="additional-name" aria-describedby="parent-middleName-error">
              <span class="field-error" id="parent-middleName-error"></span>
            </label>
            <label><span class="field-label">Телефон <span aria-hidden="true">*</span></span>
              <input name="phone" type="tel" autocomplete="tel" required aria-describedby="parent-phone-error">
              <span class="field-error" id="parent-phone-error"></span>
            </label>
            <label><span class="field-label">Електронна пошта <span aria-hidden="true">*</span></span>
              <input name="email" type="email" autocomplete="email" required aria-describedby="parent-email-error">
              <span class="field-error" id="parent-email-error"></span>
            </label>
            <label><span class="field-label">Ким доводиться <span aria-hidden="true">*</span></span>
              <select name="relationship" required aria-describedby="parent-relationship-error">
                <option value="">Оберіть ступінь спорідненості</option>
                <option value="mother">Мати</option>
                <option value="father">Батько</option>
                <option value="guardian">Законний представник</option>
              </select>
              <span class="field-error" id="parent-relationship-error"></span>
            </label>
          </div>
          <p class="form-message" id="parent-form-message" role="status" aria-live="polite"></p>
          <button class="submit-button" type="submit">Додати представника</button>
        </form>
        <div class="table-wrap" id="parents-table"></div>
      </section>
      <section class="entity-panel" id="camp-shifts-panel" role="tabpanel" aria-labelledby="camp-shifts-tab" hidden>
        <form class="record-form" id="camp-shift-form" novalidate>
          <h2>Додати табірну зміну</h2>
          <div class="form-grid">
            <label class="form-field-wide"><span class="field-label">Назва зміни <span aria-hidden="true">*</span></span>
              <input name="name" type="text" maxlength="120" required aria-describedby="camp-shift-name-error">
              <span class="field-error" id="camp-shift-name-error"></span>
            </label>
            <label><span class="field-label">Дата початку <span aria-hidden="true">*</span></span>
              <input name="startDate" type="date" required aria-describedby="camp-shift-startDate-error">
              <span class="field-error" id="camp-shift-startDate-error"></span>
            </label>
            <label><span class="field-label">Дата завершення <span aria-hidden="true">*</span></span>
              <input name="endDate" type="date" required aria-describedby="camp-shift-endDate-error">
              <span class="field-error" id="camp-shift-endDate-error"></span>
            </label>
            <label><span class="field-label">Вартість, грн <span aria-hidden="true">*</span></span>
              <input name="price" type="number" min="0" step="any" required aria-describedby="camp-shift-price-error">
              <span class="field-error" id="camp-shift-price-error"></span>
            </label>
            <label><span class="field-label">Місткість, дітей <span aria-hidden="true">*</span></span>
              <input name="capacity" type="number" min="1" step="1" required aria-describedby="camp-shift-capacity-error">
              <span class="field-error" id="camp-shift-capacity-error"></span>
            </label>
            <label class="form-field-wide">Опис програми
              <textarea name="description" rows="3" maxlength="1000" aria-describedby="camp-shift-description-error"></textarea>
              <span class="field-error" id="camp-shift-description-error"></span>
            </label>
          </div>
          <p class="form-message" id="camp-shift-form-message" role="status" aria-live="polite"></p>
          <button class="submit-button" type="submit">Додати зміну</button>
        </form>
        <div class="table-wrap" id="camp-shifts-table"></div>
      </section>
      <section class="entity-panel" id="bookings-panel" role="tabpanel" aria-labelledby="bookings-tab" hidden>
        <form class="record-form" id="booking-form" novalidate>
          <h2>Нове бронювання</h2>
          <div class="form-grid">
            <label><span class="field-label">Дитина <span aria-hidden="true">*</span></span>
              <select name="childId" required aria-describedby="booking-childId-error"><option value="">Оберіть дитину</option></select>
              <span class="field-error" id="booking-childId-error"></span>
            </label>
            <label><span class="field-label">Законний представник <span aria-hidden="true">*</span></span>
              <select name="parentId" required aria-describedby="booking-parentId-error"><option value="">Оберіть законного представника</option></select>
              <span class="field-error" id="booking-parentId-error"></span>
            </label>
            <label><span class="field-label">Зміна <span aria-hidden="true">*</span></span>
              <select name="shiftId" required aria-describedby="booking-shiftId-error"><option value="">Оберіть зміну</option></select>
              <span class="field-error" id="booking-shiftId-error"></span>
            </label>
            <label><span class="field-label">Статус замовлення <span aria-hidden="true">*</span></span>
              <select name="status" required aria-describedby="booking-status-error">
                <option value="new">Нове</option><option value="pending">Очікує підтвердження</option>
                <option value="confirmed">Підтверджене</option><option value="cancelled">Скасоване</option>
                <option value="completed">Завершене</option>
              </select>
              <span class="field-error" id="booking-status-error"></span>
            </label>
            <label><span class="field-label">Статус оплати <span aria-hidden="true">*</span></span>
              <select name="paymentStatus" required aria-describedby="booking-paymentStatus-error">
                <option value="unpaid">Не оплачено</option><option value="partially_paid">Сплачено частково</option>
                <option value="paid">Сплачено</option><option value="refunded">Кошти повернено</option>
              </select>
              <span class="field-error" id="booking-paymentStatus-error"></span>
            </label>
            <label class="form-field-wide">Коментар
              <textarea name="comment" rows="3" maxlength="1000" aria-describedby="booking-comment-error"></textarea>
              <span class="field-error" id="booking-comment-error"></span>
            </label>
          </div>
          <p class="form-message" id="booking-form-message" role="status" aria-live="polite"></p>
          <button class="submit-button" type="submit">Додати бронювання</button>
        </form>
        <div class="table-wrap" id="bookings-table"></div>
      </section>
    </main>
  </body>
</html>
